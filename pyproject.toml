[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datongauth-compress_jd325"
version = "0.1.0"
description = "按结构键把条目聚类，标出模型压缩工程师·批处理调度与吞吐折中上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "datongauth" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://datongauth.github.io"
Repository = "https://github.com/datongauth/compress_jd325"
Issues = "https://github.com/datongauth/compress_jd325/issues"

[project.scripts]
compress_jd325 = "compress_jd325:main"

[tool.setuptools]
py-modules = ["compress_jd325"]
